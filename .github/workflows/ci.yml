name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# This app only ever runs on Windows (it shells out to wsl.exe), so CI runs
# on windows-latest rather than a cheaper Linux runner to match the real
# target and let #[cfg(windows)] code actually compile and run.
jobs:
  frontend:
    name: Frontend (build + test)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  backend:
    name: Backend (fmt + clippy + test)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

[package]
name = "app"
version = "0.5.60"
description = "WSL2内のCodex CLI（app-server）をWindowsネイティブGUIから操作するためのラッパーアプリ"
authors = ["Fuyuki Yoneyama"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }

# GetLastInputInfo/GetTickCount for desktop-wide idle detection (the
# turn-finished flash only fires when the user is away from the machine, not
# just away from this window). A webview only ever sees input delivered to its
# own window, so this has to come from the OS.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
# GetForegroundWindow, compared against WebviewWindow::hwnd(), for a ground-
# truth focus check independent of Tauri's own isFocused() -- see the
# is_window_focused doc comment for why that's necessary. Pinned to the same
# version tauri itself already pulls in (WebviewWindow::hwnd() returns this
# crate's HWND, not windows-sys's, so the types must match) to avoid a
# duplicate copy of the crate in the dependency tree.
windows = { version = "=0.61.3", features = ["Win32_UI_WindowsAndMessaging"] }

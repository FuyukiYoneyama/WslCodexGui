# cargo-about の設定（scripts/generate-third-party-licenses.mjs が使う）。
# 配布バイナリに含まれるクレートのライセンスとして受け入れるもの。
# ここに無いライセンスのクレートが加わると生成が失敗するので、内容を確認してから追加する。
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "0BSD",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
]
# Windows向けの配布物だけを対象にする。
targets = ["x86_64-pc-windows-msvc"]
# ビルド時だけ使う依存（build-dependencies / dev-dependencies）は配布物に含まれない。
ignore-build-dependencies = true
ignore-dev-dependencies = true
